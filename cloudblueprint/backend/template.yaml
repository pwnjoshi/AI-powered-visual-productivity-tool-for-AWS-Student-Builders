AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CloudBlueprint - AWS Architecture Generator Backend Setup

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.12
    Environment:
      Variables:
        TABLE_NAME: !Ref SavedArchitecturesTable

Resources:
  SavedArchitecturesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SavedArchitectures
      AttributeDefinitions:
        - AttributeName: arch_id
          AttributeType: S
      KeySchema:
        - AttributeName: arch_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  GeneratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./generator
      Handler: lambda_function.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SavedArchitecturesTable
        - Statement:
            Effect: Allow
            Action:
              - bedrock:InvokeModel
            Resource: '*'
      Events:
        GenerateApi:
          Type: Api
          Properties:
            Path: /generate
            Method: post

  HistoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./history
      Handler: lambda_function.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SavedArchitecturesTable
      Events:
        HistoryApi:
          Type: Api
          Properties:
            Path: /history
            Method: get

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL for CloudBlueprint"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
